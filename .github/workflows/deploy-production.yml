name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  RELEASE_KEY: deployments/orbithr-${{ github.sha }}.tgz

jobs:
  verify-and-deploy:
    name: Verify and deploy to EC2
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN DEPLOY_BUCKET EC2_INSTANCE_ID; do
            [[ -n ${!name} ]] || exit 1
          done
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package release
        run: |
          tar -czf release.tgz dist server prisma public deploy \
            package.json package-lock.json tsconfig*.json
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload release
        run: aws s3 cp release.tgz s3://${DEPLOY_BUCKET}/${RELEASE_KEY} --sse AES256
      - name: Deploy through SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'set -euo pipefail' > /tmp/deploy.sh
          cat >> /tmp/deploy.sh <<EOF
          artifact=/tmp/orbithr-${GITHUB_SHA}.tgz
          installer=/tmp/orbithr-install-${GITHUB_SHA}.sh
          aws s3 cp s3://${DEPLOY_BUCKET}/${RELEASE_KEY} \${artifact}
          tar -xOf \${artifact} deploy/install-ec2-release.sh > \${installer}
          chmod 700 \${installer}
          \${installer} \${artifact} ${GITHUB_SHA}-${GITHUB_RUN_ID}
          rm -f \${artifact} \${installer}
          EOF
          jq -Rs '{commands: [.]}' /tmp/deploy.sh > /tmp/params.json
          command_id=$(aws ssm send-command \
            --instance-ids ${EC2_INSTANCE_ID} \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo SSM-command-${command_id}
          wait_status=1
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation \
              --command-id ${command_id} --instance-id ${EC2_INSTANCE_ID} \
              --query Status --output text 2>/dev/null || echo Pending)
            if [[ ${status} == Success ]]; then wait_status=0; break; fi
            if [[ ${status} =~ ^(Failed|Cancelled|TimedOut)$ ]]; then break; fi
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id ${command_id} --instance-id ${EC2_INSTANCE_ID}
          status=$(aws ssm get-command-invocation \
            --command-id ${command_id} --instance-id ${EC2_INSTANCE_ID} \
            --query Status --output text)
          [[ ${wait_status} -eq 0 && ${status} == Success ]]

      - name: Remove release artifact
        if: always() && steps.deploy.outcome != 'skipped'
        run: aws s3 rm s3://${DEPLOY_BUCKET}/${RELEASE_KEY}
