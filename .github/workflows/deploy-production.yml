name: Deploy OrbitHR Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orbithr-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: OrbitHR-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy OrbitHR commit ${{ github.sha }}" \
              --parameters '{"commands":["/usr/local/sbin/orbithr-deploy"],"executionTimeout":["900"]}' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          FINAL_STATUS=""

          for attempt in $(seq 1 120); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                FINAL_STATUS="Success"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "OrbitHR deployment failed with status: ${FINAL_STATUS:-Timeout}"
            exit 1
          fi
